<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- White background, black border for the browser -->
  <rect x="4" y="16" width="120" height="96" rx="12" fill="#ffffff" stroke="#18181b" stroke-width="8"/>
  <line x1="4" y1="40" x2="124" y2="40" stroke="#18181b" stroke-width="8"/>
  
  <circle cx="20" cy="28" r="4" fill="#18181b"/>
  <circle cx="36" cy="28" r="4" fill="#18181b"/>
  
  <!-- Extremely simplified brain (cloud-like with a center split) -->
  <g stroke="#18181b" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left half -->
    <path d="M 60 52 
             C 45 45, 25 55, 30 75
             C 20 95, 45 105, 55 95
             C 50 85, 55 70, 60 65" />
    <!-- Right half -->
    <path d="M 68 52 
             C 83 45, 103 55, 98 75
             C 108 95, 83 105, 73 95
             C 78 85, 73 70, 68 65" />
    <!-- Center stem -->
    <line x1="64" y1="65" x2="64" y2="105"/>
  </g>
</svg>
